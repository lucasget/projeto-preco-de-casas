[project]
name = "casa"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name", email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12, <4.0"
dependencies = [
    "pandas (>=3.0.1,<4.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "plotly (>=6.6.0,<7.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scipy (>=1.17.1,<2.0.0)",
    "nbformat (>=5.10.4,<6.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "fastapi[standard] (>=0.141.1,<0.142.0)",
    "streamlit (>=1.63.0,<2.0.0)",
    "certifi (>=2026.7.22,<2027.0.0)",
    "mlflow (>=3.16.1,<4.0.0)",
    "torch (>=2.14.0,<3.0.0)",
    "torchmetrics (>=1.9.0,<2.0.0)"
]

[tool.poetry]
packages = [{include = "casa", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.5,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)"
]

[tool.ruff]
line-length = 79
# Define apenas quais arquivos/módulos serão analisados pelo Ruff
include = [
    "**/app.py",
    "**/schemas.py"
]
# Pastas e extensoes a ignorar totalmente
extend-exclude = [
    "migrations",
    "*.ipynb",
    "**/notebook/**"
]

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']
ignore = ["E501"]

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = '.'
addopts = '-p no:warnings'

[tool.taskipy.tasks]
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
run = 'fastapi dev src/casa/backend/fastapi_zero/app.py'
pre_test = 'task lint'
test = 'pytest -s -x --cov=src/casa/backend/fastapi_zero -vv'
post_test = 'coverage html'
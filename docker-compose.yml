services:
  backend:
    build:
      context: .
      dockerfile: src/casa/backend/Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/src
    restart: always

  frontend:
    build:
      context: .
      dockerfile: src/casa/frontend/Dockerfile
    container_name: frontend
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app/src
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: always